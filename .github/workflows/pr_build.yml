name: PR Build

on: 
  pull_request: {}


permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup Golang
        uses: actions/setup-go@19bb51245e9c80abacb2e91cc42b33fa478b8639 # v4.2.1
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build baseca Executable
        run: make build

      - name: baseca Unit Test
        run: make test

      - name: gosec Scanner
        uses: securego/gosec@017d1d655c299165954ba3c6d99bdb86319ecb6a # master
        with:
          args: -exclude-dir=examples ./...

      - name: Build baseca Container
        run: docker build -f Dockerfile -t baseca .